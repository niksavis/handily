# Scaffolded by `basicly install`; yours to edit — install never overwrites it.
name: basicly-gates

# Tracker-only pushes skip CI: the harness loop necessarily commits tracker state
# separately from the work, and the local commit-msg hooks are the deterministic
# floor for those commits. Both stores are named while both exist.
"on":
  push:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".basicly/ledger/**"
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate commit messages
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            range="${base_sha}..${head_sha}"
          else
            before_sha="${{ github.event.before }}"
            zeros="0000000000000000000000000000000000000000"
            if [ -z "${before_sha}" ] || [ "${before_sha}" = "${zeros}" ]; then
              range="${{ github.sha }}"
            else
              range="${before_sha}..${{ github.sha }}"
            fi
          fi
          echo "Checking commit messages in range: ${range}"
          failed=0
          while IFS= read -r sha; do
            [ -z "${sha}" ] && continue
            msg_file="$(mktemp)"
            git log -1 --format='%B' "${sha}" > "${msg_file}"
            python3 .basicly/core/hooks/commit-msg.py "${msg_file}" || failed=1
            rm -f "${msg_file}"
          done < <(git log --format='%H' "${range}")
          exit "${failed}"

  gates:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v7
      - name: Catalog lint
        run: uvx --from https://github.com/niksavis/basicly/releases/download/v0.47.1/basicly-0.47.1-py3-none-any.whl basicly catalog lint
      - name: Projection drift check
        run: uvx --from https://github.com/niksavis/basicly/releases/download/v0.47.1/basicly-0.47.1-py3-none-any.whl basicly check
      - name: Skill projection drift check
        run: uvx --from https://github.com/niksavis/basicly/releases/download/v0.47.1/basicly-0.47.1-py3-none-any.whl basicly skills-check
      - name: Hook wiring drift check
        run: |
          uvx --from https://github.com/niksavis/basicly/releases/download/v0.47.1/basicly-0.47.1-py3-none-any.whl basicly hooks-build --runtime-only
          uvx --from https://github.com/niksavis/basicly/releases/download/v0.47.1/basicly-0.47.1-py3-none-any.whl basicly hooks-check
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-fund --no-audit
      - name: Install the pinned Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.329
      - name: mods-validate
        run: node scripts/mods.mjs validate
      - name: mods-typecheck
        if: ${{ !cancelled() }}
        run: node scripts/mods.mjs typecheck
      - name: eslint
        if: ${{ !cancelled() }}
        run: node scripts/mods.mjs lint
      - name: prettier
        if: ${{ !cancelled() }}
        run: npx --no-install prettier --no-error-on-unmatched-pattern --check mods probes scripts eslint.config.mjs
      - name: scripts tests
        if: ${{ !cancelled() }}
        run: node scripts/mods.mjs test-scripts

  mod-tests:
    name: mod tests ${{ matrix.shard }} of ${{ matrix.shards }} on ${{ matrix.engine }} Claude Code
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [pinned, newest]
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - engine: pinned
            package: "@anthropic-ai/claude-code@2.1.329"
            shards: 6
          - engine: newest
            package: "@anthropic-ai/claude-code@latest"
            shards: 6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dev dependencies
        if: github.event_name != 'schedule' || matrix.engine == 'newest'
        run: npm ci --no-fund --no-audit
      - name: Install the Claude Code CLI
        if: github.event_name != 'schedule' || matrix.engine == 'newest'
        run: npm install -g "${{ matrix.package }}"
      - name: Print the resolved Claude Code version
        if: github.event_name != 'schedule' || matrix.engine == 'newest'
        shell: bash
        run: claude --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run the mod tests of this shard
        if: github.event_name != 'schedule' || matrix.engine == 'newest'
        run: node scripts/mods.mjs test --shard ${{ matrix.shard }}/${{ matrix.shards }}

  mods-newest:
    name: mods on newest Claude Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dev dependencies
        run: npm ci --no-fund --no-audit
      - name: Install the newest Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Print the resolved Claude Code version
        shell: bash
        run: claude --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Validate the mods on the newest Claude Code
        run: npm run validate
      - name: Run the scripts tests on the newest Claude Code
        if: ${{ !cancelled() }}
        run: npm run test-scripts

  report-break:
    name: report a break of the newest Claude Code
    needs: [mod-tests, mods-newest]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTS: ${{ needs.mod-tests.result }}
          NEWEST: ${{ needs.mods-newest.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          version="$(npm view @anthropic-ai/claude-code version)"
          title="Claude Code ${version} breaks handily"
          failed=""
          [ "${TESTS}" = "failure" ] && failed="${failed} mod tests on the newest Claude Code;"
          [ "${NEWEST}" = "failure" ] && failed="${failed} mods on newest Claude Code;"
          body="Failed jobs:${failed} run ${RUN_URL}"
          number="$(gh issue list --state open --search "\"${title}\" in:title" --json number --jq '.[0].number')"
          if [ -n "${number}" ]; then
            gh issue comment "${number}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi
