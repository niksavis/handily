schema_version: 1
id: commands
description: Verbatim-runnable commands for everyday development.
category: commands
priority: high
applies_to: [all]
tags: [commands, build, test]
status: active
title: Commands
body: |
  Commands in code fences are exact - run them verbatim instead of improvising variants.

  Setup:

  ```sh
  npm ci
  npm run types
  ```

  All gates (validate, typecheck, lint, test) over every mod:

  ```sh
  npm run check
  ```

  One gate over every mod:

  ```sh
  npm run validate
  npm run typecheck
  npm run lint
  npm test
  ```

  One mod:

  ```sh
  claude plugin validate --strict mods/<name>
  claude plugin test mods/<name>
  ```

  Format:

  ```sh
  npm run format
  ```

  Load a mod in a session for a manual check:

  ```sh
  claude --plugin-dir mods/<name>
  ```
